# ---- src/cmd/cli.rs ----
cmd.cli.001: "ysql -- command line with user and database (ydbms service mode)\n\nUsage:\n  ysql [-U user] [-d db] [-f script] [--server-dist dir]\n\nOptions:\n  -U <user>             who to connect as (default $USER)\n  -d <db>               which database to connect to (default the same name as -U)\n  -f <script>           run this script and exit (default: interactive terminal);\n                        in script mode the per-statement status lines are off by default,\n                        turn them on with \\set VERBOSE on\n  --server-dist <dir>   service directory: users.json and the databases live here (default $HOME/.ydbms);\n                        a relative path is pinned to the working directory\n                        at startup, so a later \\cd cannot move it\n  -h, --help            this help\n\nThe password comes from the PGPASSWORD environment variable; without it, an interactive run prompts for it and a non-interactive run fails immediately.\nWhen users.json does not exist (first use), this -U is created as an administrator and the default database is created along with it.\nWithout -d, a missing default database is created automatically (the owner is -U); with an explicit -d the database must already exist.\nWithout -f you get the interactive terminal; `ysql < script.sql` also reads from standard input.\n\nWrites are persisted on commit: with no transaction every statement commits by itself. Wrap bulk loading in\nBEGIN; ... COMMIT; -- otherwise every write statement rewrites the whole table.\nExiting with a transaction still open throws it away (the same as disconnecting from PostgreSQL).\n\nExit codes: 0 normal; 1 usage / authentication / failure to open the database, or the -f script reported an error.\n"
