# ---- src/cmd/repl.rs ----
cmd.repl.001: "Bye."
cmd.repl.002: "ydbms - empty database (no built-in tables)."
cmd.repl.003: "Paths are resolved against the current working directory. A script keeps running after an error and reports each one -- every statement is its own transaction and is rolled back on failure."
cmd.repl.004: "Data lives only in memory and is lost on exit. To have users and on-disk databases, use ysql."
cmd.repl.005: "ydbms - database `%{arg0}`, user `%{arg1}`."
cmd.repl.006: "Service directory: %{arg0}"
cmd.repl.007: "  users.json                      user table (salted hashes, no plaintext)"
cmd.repl.008: "  %{arg0}/catalog.json                database metadata (owner, creation time, database-level search_path)"
cmd.repl.009: "  %{arg0}/commit.json                 commit intent (exists only at the instant of the commit)"
cmd.repl.010: "  %{arg0}/<table>.csv + <table>.schema.json  table data and schema"
cmd.repl.011: "Writes are **persisted on commit**: with no transaction every statement commits by itself (and is rolled back on failure)."
cmd.repl.012: "Inside `BEGIN; ... COMMIT;` nothing is persisted at all, only `COMMIT` writes; exiting with the transaction still open throws it away."
cmd.repl.013: "  <SQL>              press Enter to run; several lines are buffered until a semicolon"
cmd.repl.014: "  Tab                completion (meta-commands, keywords, table names, column names, paths)"
cmd.repl.015: "  EXPLAIN <SQL>      print only the lowered linear IR"
cmd.repl.016: "  \\i <script path>   run a script (every meta-command except \\! works in a script, and scripts can nest)"
cmd.repl.017: "  \\o [file]          redirect the **query result table**; without a file name it goes back to standard output"
cmd.repl.018: "  \\d [table]         list all tables / list the columns of one table"
cmd.repl.019: "  \\dt                list all tables"
cmd.repl.020: "  \\timing [on|off]   print the elapsed time after every statement; without an argument it toggles"
cmd.repl.021: "  \\set ON_ERROR_STOP on   stop at the first error (the default is to keep going)"
cmd.repl.022: "  \\pwd               current directory"
cmd.repl.023: "  \\ls [dir]          list a directory"
cmd.repl.024: "  \\cd [dir]          change directory (with no argument, back to $HOME)"
cmd.repl.025: "  \\echo <text>       echo verbatim"
cmd.repl.026: "  \\! <shell command>  available only in an interactive terminal (disabled in scripts)"
cmd.repl.027: "  \\q / exit          quit (Ctrl-D works too, Ctrl-C discards the line)"
cmd.repl.028: "  \\c [database]      switch database (the old lock is released at once; COMMIT / ROLLBACK an open transaction first)"
cmd.repl.029: "  \\l                 list the databases and their owners"
cmd.repl.030: "  \\du                list the roles (attributes, memberships)"
cmd.repl.031: "  %{arg0}/grants.json                 grants (who may connect; who may SELECT / INSERT / UPDATE a table)"
cmd.repl.032: "  \\set VERBOSE on|off   per-statement status lines and summaries (on interactively, off under -f)"
cmd.repl.033: "  \\ir <script path>     like \\i, but a relative path is resolved against the **current script** (nested includes follow along)"

